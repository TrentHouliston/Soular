rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling:
    status: done
    comment: >-
      The weather model is fetched every thirty minutes, matched to how often
      Open-Meteo publishes; the forecast is recomputed every five because the
      sun keeps moving.
  brands:
    status: todo
    comment: Pending a pull request against home-assistant/brands.
  common-modules:
    status: done
    comment: coordinator/, entities/, flows/ and sources/ follow the conventional layout.
  config-flow-test-coverage:
    status: done
    comment: flows/tests/ covers the hub and array flows, including validation failures.
  config-flow:
    status: done
    comment: A site hub flow, plus an array subentry flow in flows/.
  dependency-transparency:
    status: done
    comment: pvlib and numpy are published on PyPI; the README documents their weight.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities are coordinator-driven and subscribe to nothing else.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The array flow parses the shading file before accepting it.
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh runs before platforms are forwarded.
  unique-config-entry:
    status: done
    comment: The hub flow keys on rounded coordinates and aborts on a duplicate site.

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Forecast sensors go unavailable when the weather is too old to trust.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0; the coordinator pushes.
  reauthentication-flow:
    status: exempt
    comment: Open-Meteo's free tier needs no credentials.
  test-coverage:
    status: done
    comment: The physics is also validated offline against a year of measured production by tools/backtest.py.

  # Gold
  devices:
    status: done
    comment: The site is a device, and each array is its own device via the site.
  diagnostics: done
  discovery:
    status: exempt
    comment: A rooftop array cannot be discovered on a network.
  discovery-update-info:
    status: exempt
    comment: As above.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: The integration models a rooftop array, not a device it talks to.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Arrays are added by the user, not found.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: todo
    comment: Coordinator failures still raise untranslated UpdateFailed.
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: The site and each array subentry are reconfigurable.
  repair-issues:
    status: todo
    comment: A repair for a shading file that fails to load is the obvious first one.
  stale-devices:
    status: done
    comment: Removing an array subentry removes its device; entities are registered against the subentry.

  # Platinum
  async-dependency:
    status: todo
    comment: pvlib is synchronous; every call into core/ runs in the executor, which mitigates rather than fixes it.
  inject-websession: done
  strict-typing: done
