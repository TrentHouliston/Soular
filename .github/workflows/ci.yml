name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  #region Linting and formatting
  # =============================================================================
  # Linting and formatting checks
  # =============================================================================

  ruff-format:
    name: Ruff format
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Ruff format (reviewdog)
        if: github.event_name == 'pull_request'
        run: |
          uv run ruff format --diff \
            | reviewdog -f=diff -name="ruff format" -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Ruff format (check)
        if: github.event_name != 'pull_request'
        run: uv run ruff format --check

  ruff-lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Ruff lint (reviewdog)
        if: github.event_name == 'pull_request'
        run: |
          uv run ruff check --output-format rdjson \
            | reviewdog -f=rdjson -name="ruff lint" -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Ruff lint (check)
        if: github.event_name != 'pull_request'
        run: uv run ruff check

  pyright:
    name: Pyright
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Pyright (reviewdog)
        if: github.event_name == 'pull_request'
        run: |
          # Run pyright with JSON output, capturing regardless of exit code
          uv run pyright --outputjson > pyright_output.json || true
          # Convert to rdjson format and pipe to reviewdog
          jq '{
            source: {name: "pyright", url: "https://github.com/Microsoft/pyright"},
            severity: "ERROR",
            diagnostics: [.generalDiagnostics[]? | {
              message: (if .rule then "\(.message) (\(.rule))" else .message end),
              severity: (.severity | ascii_upcase),
              location: {
                path: .file,
                range: {
                  start: {line: (.range.start.line + 1), column: (.range.start.character + 1)},
                  end: {line: (.range.end.line + 1), column: (.range.end.character + 1)}
                }
              }
            }]
          }' pyright_output.json \
            | reviewdog -f=rdjson -name="pyright" -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Pyright (check)
        if: github.event_name != 'pull_request'
        run: uv run pyright

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Prettier (reviewdog)
        if: github.event_name == 'pull_request'
        run: |
          npm ci
          npx --yes prettier@3 --write .
          git diff \
            | reviewdog -f=diff -name="prettier" -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Prettier (check)
        if: github.event_name != 'pull_request'
        run: |
          npm ci
          npx --yes prettier@3 --check .

  mdformat:
    name: Markdown format
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Setup reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.20.3

      - name: Markdown format (reviewdog)
        if: github.event_name == 'pull_request'
        run: |
          uv run mdformat $(git ls-files '*.md' '*.mdx')
          git diff \
            | reviewdog -f=diff -name="mdformat" -reporter=github-pr-review -filter-mode=nofilter -fail-level=any

      - name: Markdown format (check)
        if: github.event_name != 'pull_request'
        run: uv run mdformat --check $(git ls-files '*.md' '*.mdx')

  import-linter:
    name: Import boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check import boundaries
        run: uv run lint-imports
  #endregion

  #region Tests
  # =============================================================================
  # Tests
  # =============================================================================

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run Tests
        run: uv run pytest -m "not benchmark and not backtest" --cov=custom_components/soular --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload test results to Codecov
        if: ${{ github.event_name != 'release' && !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results

      - name: Upload coverage to Codecov
        # Skipped until CODECOV_TOKEN is set, because a tokenless upload is
        # rejected outright and would fail the run for a reason that has nothing
        # to do with the tests. Strict once the token exists: a coverage report
        # that silently stops being uploaded is a report nobody is reading.
        # The secrets context is not readable from a step-level 'if', so the
        # token is lifted into env first and the condition tests that.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: ${{ github.event_name != 'release' && !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          fail_ci_if_error: true
  #endregion

  #region Validation
  # =============================================================================
  # Validation checks
  # =============================================================================

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check Soular version consistency
        run: |
          PYPROJECT=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          MANIFEST=$(jq -r '.version' custom_components/soular/manifest.json)
          echo "pyproject.toml=$PYPROJECT manifest.json=$MANIFEST"
          [[ "$PYPROJECT" == "$MANIFEST" ]]

      - name: Check Home Assistant version consistency
        run: |
          PYPROJECT=$(uv run python -c "import tomllib, re; deps=tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(re.search(r'homeassistant>=(\d+\.\d+\.\d+)', str(deps)).group(1))")
          HACS=$(jq -r '.homeassistant' hacs.json)
          echo "pyproject.toml=$PYPROJECT hacs.json=$HACS"
          [[ "$PYPROJECT" == "$HACS" ]]

      - name: Check pvlib pin consistency
        run: |
          # manifest.json requirements are what Home Assistant actually pip installs at
          # runtime; pyproject is what CI tests against. A drift between them means the
          # tested model and the shipped model are not the same code.
          PYPROJECT=$(uv run python -c "import tomllib, re; deps=tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies']; print(re.search(r'pvlib>=(\S+?)[\"\x27]', str(deps)).group(1))")
          MANIFEST=$(jq -r '.requirements[] | select(startswith("pvlib"))' custom_components/soular/manifest.json | sed 's/pvlib>=//')
          echo "pyproject.toml=$PYPROJECT manifest.json=$MANIFEST"
          [[ "$PYPROJECT" == "$MANIFEST" ]]

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # HACS publish requirements (issues enabled, repo topics, etc.) only apply
    # to the canonical integration repo. Skip on forks so they don't show red.
    # Matched case-insensitively: GitHub redirects repository URLs regardless of
    # case, so a mismatch here would not break a single link -- it would just
    # skip this job forever, and 'skipped' is a pass to the aggregator below.
    if: ${{ github.repository == 'TrentHouliston/soular' || github.repository == 'TrentHouliston/Soular' }}
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Remove this 'ignore' key once brand images are added to
          # https://github.com/home-assistant/brands
          ignore: brands
  #endregion

  #region CI passed
  # =============================================================================
  # CI passed (single required check)
  # =============================================================================

  ci-passed:
    name: CI passed
    if: always()
    needs:
      - ruff-format
      - ruff-lint
      - pyright
      - prettier
      - mdformat
      - import-linter
      - test
      - hassfest
      - version-check
      - hacs
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          # 'skipped' is allowed (e.g., hacs is gated to the upstream repo).
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs were cancelled"
            exit 1
          fi
          echo "All required jobs passed!"
  #endregion
